<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Una pequeña sorpresa para ti — Ana Lidia</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap");

:root{
--black:#08070b;
--black-2:#121019;
--black-3:#1c1822;
--pink:#f2a1c2;
--pink-2:#cf668f;
--gold:#d6ae69;
--gold-soft:#f0d5a3;
--white:#fffafd;
--muted:#b6a8b2;
--line:rgba(242,161,194,.16)
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
margin:0;
min-height:100vh;
color:var(--white);
font-family:"Montserrat",Arial,sans-serif;
background:
radial-gradient(circle at 12% 8%,rgba(207,102,143,.14),transparent 28%),
radial-gradient(circle at 88% 82%,rgba(214,174,105,.10),transparent 30%),
linear-gradient(145deg,#060509 0%,#110d16 48%,#08070b 100%)
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
opacity:.23;
background-image:radial-gradient(rgba(255,255,255,.16) .45px,transparent .7px);
background-size:7px 7px
}

button,input{font:inherit}

.screen{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:44px 20px
}

.panel{
width:min(980px,100%);
position:relative
}

.card{
position:relative;
overflow:hidden;
text-align:center;
background:linear-gradient(145deg,rgba(28,24,34,.92),rgba(8,7,11,.94));
border:1px solid var(--line);
border-radius:22px;
padding:clamp(30px,6vw,76px);
box-shadow:0 30px 100px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.04);
animation:in .55s ease
}

.card:before{
content:"";
position:absolute;
inset:12px;
border:1px solid rgba(214,174,105,.18);
border-radius:14px;
pointer-events:none
}

.card:after{
content:"✦";
position:absolute;
right:24px;
top:20px;
color:var(--gold);
opacity:.65;
font-size:14px
}

h1,h2,h3,.final25,.countdown{
font-family:"Playfair Display",Georgia,serif;
font-weight:500
}

h1{
font-size:clamp(3.2rem,9vw,7rem);
line-height:.9;
letter-spacing:-.04em;
margin:.15em 0 .3em;
color:var(--pink)
}

h2{
font-size:clamp(2.15rem,5vw,4.2rem);
line-height:1;
margin:.25em 0 .5em;
color:var(--gold-soft)
}

h3{
font-size:1.35rem;
color:var(--pink)
}

p{
font-size:1rem;
line-height:1.85
}

.muted{
color:var(--muted);
letter-spacing:.16em;
text-transform:uppercase;
font-size:.68rem
}

.eyebrow{
letter-spacing:.3em;
font-size:.62rem;
color:var(--gold);
margin-bottom:14px
}

.intro{
max-width:590px;
margin:0 auto 28px;
color:#ded3da
}

.tiny{
font-size:.75rem;
color:var(--muted);
letter-spacing:.04em
}

.btn{
background:transparent;
border:1px solid rgba(242,161,194,.52);
color:var(--white);
padding:13px 23px;
border-radius:999px;
cursor:pointer;
margin:7px;
letter-spacing:.12em;
font-size:.68rem;
text-transform:uppercase;
transition:.25s ease
}

.btn:hover{
background:var(--pink);
color:var(--black);
border-color:var(--pink);
transform:translateY(-2px)
}

.btn.pink{
border-color:var(--gold);
color:var(--gold-soft)
}

.btn.pink:hover{
background:var(--gold);
border-color:var(--gold);
color:var(--black)
}

.btn.wide{min-width:240px}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:13px;
margin:28px 0
}

.choice,.day{
background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
border:1px solid var(--line);
border-radius:15px;
padding:18px;
cursor:pointer;
transition:.25s ease
}

.choice:hover,.day:hover{
border-color:rgba(214,174,105,.72);
background:rgba(242,161,194,.055);
box-shadow:0 16px 42px rgba(0,0,0,.3),0 0 0 1px rgba(242,161,194,.05);
transform:translateY(-4px)
}

.choice.opened{
border-color:var(--gold);
background:rgba(214,174,105,.07)
}

.calendar{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:11px;
margin:36px auto;
max-width:780px
}

.day{
min-height:122px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
position:relative
}

.day:before{
content:"DÍA";
font-size:.54rem;
letter-spacing:.22em;
color:var(--muted);
margin-bottom:7px
}

.day .n{
font-family:"Playfair Display",serif;
font-size:2.35rem;
color:var(--pink)
}

.day small{
font-size:.59rem;
letter-spacing:.13em;
text-transform:uppercase;
color:var(--muted);
margin-top:3px
}

.day.done{
border-color:rgba(214,174,105,.8)
}

.day.done:after{
content:"✦";
position:absolute;
top:10px;
right:12px;
color:var(--gold);
font-size:.75rem
}

.stars{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
margin:30px auto;
max-width:650px
}

.star{
font-size:2rem;
background:transparent;
border:0;
color:#4b424d;
cursor:pointer;
transition:.2s
}

.star:hover{transform:scale(1.12)}

.star.on{
color:var(--gold);
text-shadow:0 0 18px rgba(214,174,105,.35)
}

.photo{
max-width:100%;
max-height:56vh;
object-fit:contain;
border-radius:14px;
border:1px solid var(--line);
box-shadow:0 18px 48px #0008
}

.letter{
max-width:690px;
margin:0 auto;
text-align:left
}

.letter p:first-child{
font-family:"Playfair Display";
font-size:1.5rem;
color:var(--pink)
}

.back{margin-top:30px}

.envelopes{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
gap:12px
}

.envelope{
min-height:160px;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(145deg,#241c28,#100e14);
border:1px solid rgba(214,174,105,.5);
border-radius:12px;
cursor:pointer;
padding:20px;
transition:.25s;
font-family:"Playfair Display";
font-size:1.4rem;
color:var(--pink)
}

.envelope:hover{
transform:translateY(-4px);
box-shadow:0 18px 40px #0008;
background:linear-gradient(145deg,#2b1e2c,#171017)
}

.countdown{
font-size:clamp(2rem,7vw,5.6rem);
color:var(--pink);
letter-spacing:.06em;
margin:22px 0;
text-shadow:0 0 28px rgba(242,161,194,.14)
}

.hidden{display:none!important}

.progress{
height:3px;
background:#ffffff12;
margin:20px 0;
border-radius:999px
}

.progress>i{
display:block;
height:100%;
background:linear-gradient(90deg,var(--pink),var(--gold));
transition:.3s
}

.find-area{
position:relative;
min-height:420px;
background:linear-gradient(145deg,#1e1822,#0c0a0f);
border:1px solid var(--line);
border-radius:14px;
overflow:hidden
}

.find-area:before{
content:"LOOK CLOSER";
position:absolute;
inset:0;
display:grid;
place-items:center;
font-family:"Playfair Display";
font-size:clamp(2rem,7vw,4.5rem);
letter-spacing:.15em;
color:rgba(242,161,194,.04)
}

.find-spot{
position:absolute;
width:75px;
height:75px;
border-radius:50%;
background:transparent;
border:1px dashed rgba(214,174,105,.55);
cursor:pointer
}

.find-spot:hover{
background:rgba(214,174,105,.1)
}

.find-spot.s1{
left:12%;
top:20%
}

.find-spot.s2{
right:14%;
bottom:18%
}

blockquote{
font-family:"Playfair Display",Georgia,serif;
font-size:clamp(1.25rem,3vw,1.9rem);
line-height:1.45;
font-weight:400;
max-width:700px;
margin:25px auto;
padding:25px 26px;
border-top:1px solid rgba(214,174,105,.65);
border-bottom:1px solid rgba(214,174,105,.65);
color:#f7eef2
}

.final25{
font-size:clamp(7rem,20vw,14rem);
line-height:.75;
color:var(--pink);
margin:10px 0;
text-shadow:0 0 38px rgba(242,161,194,.12)
}

audio{
width:min(100%,520px);
margin:18px auto;
filter:sepia(.2) hue-rotate(290deg)
}

input{
background:rgba(0,0,0,.22)!important;
border:1px solid rgba(214,174,105,.6)!important;
color:var(--white)!important;
outline:none;
border-radius:10px!important
}

@keyframes in{
from{
opacity:0;
transform:translateY(14px)
}
to{
opacity:1;
transform:none
}
}

@media(max-width:700px){
.calendar{
grid-template-columns:repeat(3,1fr)
}

.card{
padding:48px 24px
}

.stars{
grid-template-columns:repeat(5,1fr)
}

.day{
min-height:100px
}
}

@media(max-width:420px){
.calendar{
grid-template-columns:repeat(2,1fr)
}
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const $=s=>document.querySelector(s);
const app=$("#app");

const state=JSON.parse(localStorage.getItem("ana25")||"{}");

state.opened=state.opened||{};

const birthday=new Date(2026,8,19,0,0,0);

const reasons=[
"Te amo por esa manera tan tuya de hacer que un momento cualquiera termine convirtiéndose en un recuerdo.",
"Por las risas que compartimos.",
"Porque incluso desde lejos consigues sentirte cerca.",
"Por cada pequeño detalle que te hace ser tú.",
"Porque contigo una conversación nunca es simplemente una conversación.",
"Por hacerme querer seguir creando recuerdos.",
"Por esa forma tuya de hacerme sonreír.",
"Por todas las cosas que todavía quiero descubrir de ti.",
"Por nuestra complicidad.",
"Porque me encanta imaginar futuros momentos contigo.",
"Por tus ocurrencias.",
"Por tu manera de querer.",
"Porque cada día contigo tiene algo diferente.",
"Por los recuerdos que ya guardamos.",
"Porque todavía nos quedan muchísimos por crear.",
"Por tu forma de estar presente.",
"Porque has llegado a formar parte de mi vida.",
"Por hacerme pensar en ti en las pequeñas cosas.",
"Porque contigo existe algo que simplemente se siente.",
"Por cada conversación que se nos fue de las manos.",
"Porque me encanta conocerte.",
"Por todo lo que hemos aprendido juntas.",
"Por ser una parte tan bonita de mi historia.",
"Porque sigo encontrando razones nuevas.",
"Porque, simplemente, eres tú."
];

function save(){
localStorage.setItem("ana25",JSON.stringify(state))
}

function esc(s){
return s.replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]))
}

function screen(content){
app.innerHTML=
`<main class="screen">
<section class="panel">
<div class="card">${content}</div>
</section>
</main>`
}

function btn(t,fn,cls=""){
return `<button class="btn ${cls}" onclick="${fn}">${t}</button>`
}

function mark(day){
state.opened[day]=true;
save()
}

function calendar(){

let days="";

for(let d=1;d<=19;d++){

days+=`
<div class="day ${state.opened[d]?"done":""}" onclick="openDay(${d})">
<span class="n">${String(d).padStart(2,"0")}</span>
<small>${state.opened[d]?"Descubierto ✦":"Abrir día"}</small>
</div>`;

}

screen(`
<div class="eyebrow">THE BIRTHDAY EDITION</div>
<p class="muted">19 días · 19 pequeños capítulos</p>
<h1>Para Ana Lidia</h1>
<p class="intro">Mientras estás editando, todos los días están completamente desbloqueados.</p>
<div class="calendar">${days}</div>
<p class="tiny">✦ Puedes abrir, editar y probar cualquier día.</p>
`);
}

function previewCalendar(){

let days="";

for(let d=1;d<=19;d++)
days+=`
<div class="day ${state.opened[d]?"done":""}" onclick="openDay(${d})">
<span class="n">${d}</span>
<small>${state.opened[d]?"Descubierto":"Abrir"}</small>
</div>`;

screen(`
<p class="muted">Modo vista previa</p>
<h1>Tu calendario</h1>
<div class="calendar">${days}</div>
${btn("VOLVER","calendar()")}
`)
}

/* PRESENTACIÓN */

function home(){

screen(`
<p class="muted">Una pequeña sorpresa para ti</p>

<h1>Felices 25<br>Ana Lidia</h1>

<p>19 días · 19 páginas · una historia</p>

<p class="muted">Ana Lidia · Antes de comenzar</p>

${btn("CONTINUAR","story()","pink")}
`);
}

/* INTRODUCCIÓN */

function story(){

screen(`
<h2>Una pequeña historia</h2>

<div class="letter">

<p>Amor...</p>

<p>
Esto no es solamente un regalo.
Quería hacer algo diferente para tus 25.
Algo que no pudieras abrir de una vez y terminar.
Quiero que lo descubrieras poco a poco.
</p>

<p>
Desde hoy hasta el 19 de septiembre,
cada día habrá una pequeña puerta.
No tienes que descubrirlo todo hoy.
La idea es que vuelvas mañana.
Y pasado.
Y al día siguiente.
</p>

<p>
Porque esta historia tiene una fecha final:
<b>tu cumpleaños.</b>
</p>

<p>
Pero antes de llegar a él,
hay 19 días para recorrer.
</p>

</div>

${btn("CONTINUAR","password()","pink")}
`);
}

function password(){

screen(`
<h2>Una contraseña</h2>

<p>
Hay cuatro números escondidos,
de un recuerdo que guardamos las dos.
</p>

<p>
Los dos primeros marcan el día
en que nuestra historia comenzó.
Los dos últimos guardan el año
en que aquel momento nació.
</p>

<p>
Si recuerdas cuál fue aquel día,
los cuatro números hallarás.
</p>

<input
id="pass"
inputmode="numeric"
maxlength="4"
placeholder="••••"
style="font-size:2rem;text-align:center;width:180px;padding:12px;border-radius:16px;border:1px solid var(--gold);background:#0003;color:white"
>

<br>

${btn("DESBLOQUEAR","checkPass()","pink")}

<p id="error"></p>
`);
}

function checkPass(){

if($("#pass").value==="0226"){
calendar()
}else{
$("#error").textContent=
"Esa no es, amor. Inténtalo otra vez. ♡"
}

}

function back(){
calendar()
}

function textDay(n,title,text){

mark(n);

screen(`
<p class="muted">
Día ${String(n).padStart(2,"0")}
</p>

<h2>${title}</h2>

<div class="letter">
${text}
</div>

<div class="back">
${btn("✦ VOLVER AL CALENDARIO ✦","back()")}
</div>
`)
}

function openDay(n){

mark(n);

({
1:day1,
2:day2,
3:day3,
4:day4,
5:day5,
6:day6,
7:day7,
8:day8,
9:day9,
10:day10,
11:day11,
12:day12,
13:day13,
14:day14,
15:day15,
16:day16,
17:day17,
18:day18,
19:day19
}[n])()
}

function day1(){

textDay(
1,
"Comienzo",
`
<p>Para Ana Lidia</p>

<p>
Si estás leyendo esto,
significa que abriste la primera puerta.
</p>

<p>
La verdad es que no quería regalarte algo
que pudieras abrir una vez,
mirar durante unos minutos y guardar.
</p>

<p>
Quería regalarte algo que tuviera tiempo.
Algo que te acompañara durante los días
anteriores a tus 25 años.
</p>

<p>
Porque 25 no es solamente un número.
Es una etapa, una historia,
todas las cosas que ya viviste
y todas las que todavía te esperan.
</p>

<p>
Solo quiero que disfrutes el viaje.
</p>

<p>
Esto recién comienza.
</p>
`
)
}

const cards=[
[
"♡ CONFIANZA",
`
Hay algo especial en poder hablar sin tener
que pensar demasiado cada palabra.
Poder contar una cosa pequeña simplemente
porque quieres compartirla.
Y también está esa tranquilidad de saber
que puedes ser tú misma.
Sin aparentar.
Sin medir cada gesto.
Simplemente tú.
Y creo que eso es de las cosas
que más valoro de nosotras.
`
],
[
"✦ COMPLICIDAD",
`
Son esas cosas que probablemente
no tendrían la misma gracia para nadie más.
Una conversación.
Una frase.
Una ocurrencia.
Una tontería que nos hace reír.
Porque poco a poco vamos creando
pequeños códigos, recuerdos y momentos
que se vuelven solamente nuestros.
Y me encanta ese pequeño mundo que tenemos.
`
],
[
"☾ CARIÑO",
`
A veces no aparece en grandes gestos.
Está en preguntar cómo estás.
En acordarse de algo que dijiste.
En querer saber cómo te fue.
En preocuparse.
En querer hacerte sonreír.
Creo que el cariño también vive ahí:
en lo sencillo, en lo cotidiano,
en querer estar presente incluso cuando
no puedes estar físicamente.
`
],
[
"∞ CONEXIÓN",
`
Hay cosas que no sabemos explicar demasiado bien.
No tienen una fecha.
No tienen una definición exacta.
Simplemente se sienten.
Es esa sensación de encontrar a alguien
con quien existe algo diferente.
De poder estar lejos y aun así sentir cercanía.
Yo simplemente sé que contigo existe.
<br><br>
<b>Y eso es suficiente.</b>
`
]
];

function day2(){

state.c2=state.c2||[];

screen(`
<p class="muted">Día 02</p>

<blockquote>
¿Recuerdas?<br><br>
No sabíamos todo lo que vendría después.
No sabíamos cuántas cosas íbamos a compartir.
Solo éramos nosotras dos...
y estaba comenzando algo que hoy significa
muchísimo para mí.
</blockquote>

<img class="photo" src="dia2.jpg" alt="Nosotras">

<h2>AHORA QUIERO JUGAR CONTIGO</h2>

<p>
Hay cuatro palabras aquí.
Cada una guarda una pequeña parte
de lo que significa para mí lo nuestro.
</p>

<div class="cards4">

${cards.map((c,i)=>`

<div
class="choice ${state.c2.includes(i)?"opened":""}"
onclick="openCard(${i})"
>

<h3>${c[0]}</h3>

<small>
${state.c2.includes(i)?"✓ DESCUBIERTO":"Tocar para descubrir"}
</small>

</div>

`).join("")}

</div>

${state.c2.length===4?
btn("VER EL FINAL","finish2()","pink"):
""}

<div class="back">
${btn("✦ VOLVER AL CALENDARIO ✦","back()")}
</div>
`)
}

function openCard(i){

if(!state.c2.includes(i)){
state.c2.push(i);
save()
}

screen(`
<h2>${cards[i][0]}</h2>

<blockquote>
${cards[i][1]}
</blockquote>

<p>✓ DESCUBIERTO</p>

${btn("VOLVER A LAS PALABRAS","day2()")}
`)
}

function finish2(){

screen(`
<div style="font-size:3rem">♡ ✦ ☾ ∞</div>

<h1>TÚ</h1>

<blockquote>
Porque al final,
detrás de todas estas palabras,
siempre termino llegando al mismo lugar.
<br><br>
A ti.
<br><br>
Y qué suerte la mía de poder decir
que formas parte de mi vida.
</blockquote>

<p>Día 02 desbloqueado. ♡</p>

${btn("✦ VOLVER AL CALENDARIO ✦","back()")}
`)
}

function day3(){

screen(`
<p class="muted">Día 03</p>

<h2>La caja de recuerdos</h2>

<p>
Hoy quiero guardar tres cosas contigo.
</p>

<p>
Una existe.
Otra vive en la memoria.
Y la última todavía nos está esperando.
</p>

${btn(
"♡ ABRIR CAJA DE RECUERDOS",
"box3()",
"pink"
)}

<div class="back">
${btn("✦ VOLVER AL CALENDARIO ✦","back()")}
</div>
`)
}

function box3(){

state.b3=state.b3||[];

screen(`
<h2>La caja está abierta</h2>

<p>
Elige lo que quieras descubrir primero.
</p>

<div class="grid">

<div class="choice" onclick="boxItem(1)">
<h3>📷 UNO</h3>
<p>Una fotografía</p>
</div>

<div class="choice" onclick="boxItem(2)">
<h3>✦ DOS</h3>
<p>Un momento</p>
</div>

<div class="choice" onclick="boxItem(3)">
<h3>♡ TRES</h3>
<p>Un futuro recuerdo</p>
</div>

</div>

${
state.b3.length===3?
btn("VER FINAL","finish3()","pink"):
""
}

${btn("VOLVER AL CALENDARIO","back()")}
`)
}

function boxItem(i){

if(!state.b3.includes(i)){
state.b3.push(i);
save()
}

let x=

i===1?

`
<img class="photo" src="dia3.jpg">

<blockquote>
Esta existe.
Es un momento que ya pasó,
una pequeña parte de nuestra historia
que ahora podemos mirar.
Y quizás algún día,
cuando haya muchas más,
esta sea solamente una de tantas.
Pero hoy quería guardarla aquí.
</blockquote>
`

:

i===2?

`
<blockquote>
Este no está en una fotografía.
Porque hay momentos que no necesitan
una cámara para quedarse con nosotros.
Una conversación.
Una risa.
Una noche.
Una frase.

const audio=$(id);

audio.load();

if(status)
status.textContent="♫ Reproduciendo...";

audio.play().then(()=>{

status.textContent="♫ Reproduciendo... ♫";

}).catch(err=>{

console.error(err);

if(status)
status.textContent=
"No se pudo iniciar la canción. Toca el botón otra vez.";

});
}

function tick(){

let d=Math.max(0,birthday-new Date());

let days=Math.floor(d/86400000);

let h=Math.floor(d/3600000)%24;

let m=Math.floor(d/60000)%60;

let s=Math.floor(d/1000)%60;

let el=$("#count");

if(el)
el.textContent=
`${String(days).padStart(2,"0")} :
${String(h).padStart(2,"0")} :
${String(m).padStart(2,"0")} :
${String(s).padStart(2,"0")}`;

if(d<=0)
clearInterval(window.timer18)
}
