<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Una pequeña sorpresa para ti — Ana Lidia</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:
        radial-gradient(circle at 20% 20%,rgba(255,190,210,.12),transparent 25%),
        radial-gradient(circle at 80% 80%,rgba(212,175,55,.08),transparent 25%),
        #090709;
    color:#f9edf2;
    font-family:'Montserrat',sans-serif;
    overflow-x:hidden;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   FONDO
========================= */

.background-particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

.particle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:rgba(255,215,150,.65);
    animation:floatParticle linear infinite;
}

@keyframes floatParticle{
    from{
        transform:translateY(110vh);
        opacity:0;
    }
    15%{opacity:1;}
    85%{opacity:1;}
    to{
        transform:translateY(-10vh);
        opacity:0;
    }
}

/* =========================
   APP
========================= */

#app{
    position:relative;
    z-index:1;
    min-height:100vh;
}

.screen{
    min-height:100vh;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:45px 20px;
}

.card{
    width:min(950px,94vw);
    background:
        linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
    border:1px solid rgba(218,180,75,.3);
    box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        inset 0 0 40px rgba(255,190,210,.025);
    border-radius:28px;
    padding:55px;
    backdrop-filter:blur(15px);
}

.small-label{
    text-transform:uppercase;
    letter-spacing:4px;
    color:#d8b45a;
    font-size:11px;
    margin-bottom:18px;
}

h1,h2,h3{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
}

h1{
    font-size:clamp(48px,8vw,92px);
    line-height:.95;
}

h2{
    font-size:clamp(38px,6vw,65px);
    margin-bottom:25px;
}

h3{
    font-size:32px;
    color:#f4cddd;
}

p{
    line-height:1.9;
    color:#eadde3;
}

.gold{
    color:#d9b85d;
}

.pink{
    color:#f1b8cb;
}

.center{
    text-align:center;
}

.romantic-text{
    max-width:720px;
    margin:0 auto;
    font-size:17px;
}

.romantic-text p{
    margin-bottom:18px;
}

.quote{
    font-family:'Cormorant Garamond',serif;
    font-size:27px;
    line-height:1.55;
    color:#f6dce7;
}

/* =========================
   BOTONES
========================= */

.btn{
    display:inline-flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    min-height:48px;
    padding:13px 25px;
    margin:8px;
    border-radius:50px;
    border:1px solid rgba(220,180,75,.55);
    background:linear-gradient(135deg,#b89038,#e3c66c);
    color:#140f09;
    font-weight:600;
    letter-spacing:1px;
    transition:.3s ease;
}

.btn:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 30px rgba(218,180,80,.2);
}

.btn.dark{
    background:rgba(255,255,255,.035);
    color:#f4dce5;
    border-color:rgba(255,255,255,.18);
}

.btn.pink-btn{
    background:linear-gradient(135deg,#9e4c6d,#d88ca8);
    color:white;
    border:none;
}

.nav-buttons{
    margin-top:35px;
    text-align:center;
}

/* =========================
   PORTADA
========================= */

.cover{
    text-align:center;
}

.cover .tiny{
    letter-spacing:6px;
    text-transform:uppercase;
    font-size:11px;
    color:#caa956;
}

.cover h1{
    margin:25px 0;
}

.cover h2{
    font-size:clamp(28px,5vw,48px);
    color:#f1c8d6;
}

.cover-line{
    width:120px;
    height:1px;
    background:#cda84e;
    margin:30px auto;
}

.cover-sub{
    color:#c7b6bd;
    letter-spacing:2px;
}

/* =========================
   PASSWORD
========================= */

.password-box{
    max-width:500px;
    margin:35px auto 0;
    text-align:center;
}

.password-input{
    width:100%;
    padding:17px 20px;
    background:rgba(0,0,0,.3);
    border:1px solid rgba(220,180,75,.35);
    border-radius:14px;
    color:white;
    text-align:center;
    font-size:23px;
    letter-spacing:10px;
    outline:none;
}

.password-input:focus{
    border-color:#d9b85d;
}

.error{
    color:#e59aaa;
    margin-top:15px;
}

/* =========================
   CALENDARIO
========================= */

.calendar{
    width:min(1100px,96vw);
}

.calendar-header{
    text-align:center;
    margin-bottom:40px;
}

.calendar-header h2{
    margin-bottom:5px;
}

.calendar-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
}

.day-card{
    min-height:145px;
    border-radius:20px;
    border:1px solid rgba(218,180,75,.25);
    background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.018));
    padding:20px;
    transition:.35s ease;
    position:relative;
    overflow:hidden;
}

.day-card:not(.locked):hover{
    transform:translateY(-7px);
    border-color:#d8b45a;
    box-shadow:0 15px 35px rgba(0,0,0,.35);
}

.day-number{
    font-size:12px;
    letter-spacing:3px;
    color:#d5b65c;
}

.day-title{
    font-family:'Cormorant Garamond',serif;
    font-size:25px;
    margin-top:15px;
}

.day-status{
    position:absolute;
    bottom:15px;
    left:20px;
    font-size:10px;
    color:#a9959d;
    letter-spacing:1px;
}

.day-card.locked{
    opacity:.42;
    cursor:not-allowed;
}

/* =========================
   SLIDES
========================= */

.slide{
    animation:slideIn .5s ease;
}

@keyframes slideIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.slide-number{
    color:#d4b257;
    letter-spacing:4px;
    text-transform:uppercase;
    font-size:11px;
    margin-bottom:15px;
}

.slide-actions{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-top:30px;
}

/* =========================
   FOTO
========================= */

.photo-frame{
    margin:30px auto;
    max-width:700px;
    border-radius:20px;
    overflow:hidden;
    border:1px solid rgba(218,180,75,.45);
    box-shadow:0 25px 70px rgba(0,0,0,.5);
}

.photo-frame img{
    display:block;
    width:100%;
    max-height:650px;
    object-fit:contain;
    background:#050405;
}

/* =========================
   DIA 2
========================= */

.memory-photo{
    margin-top:30px;
    opacity:0;
    transform:scale(.94);
    transition:1s ease;
}

.memory-photo.show{
    opacity:1;
    transform:scale(1);
}

/* =========================
   DIA 3 CAJA
========================= */

.memory-box{
    width:190px;
    height:145px;
    margin:40px auto;
    position:relative;
    transition:.5s;
    cursor:pointer;
}

.box-body{
    position:absolute;
    bottom:0;
    left:0;
    width:190px;
    height:110px;
    background:linear-gradient(145deg,#9b315b,#d47b9c);
    border-radius:8px 8px 15px 15px;
    box-shadow:0 20px 40px rgba(0,0,0,.4);
}

.box-lid{
    position:absolute;
    top:15px;
    left:-8px;
    width:206px;
    height:35px;
    background:#e0a0b8;
    border-radius:8px;
    transform-origin:left center;
    transition:1s ease;
    z-index:3;
}

.memory-box.open .box-lid{
    transform:rotate(-20deg) translate(-10px,-35px);
}

.box-ribbon{
    position:absolute;
    width:24px;
    height:145px;
    background:#e1c15d;
    left:83px;
    top:0;
    z-index:4;
    pointer-events:none;
}

/* =========================
   TARJETAS
========================= */

.choice-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
    max-width:750px;
    margin:30px auto;
}

.choice{
    border:1px solid rgba(218,180,75,.3);
    background:rgba(255,255,255,.035);
    border-radius:18px;
    padding:25px;
    min-height:130px;
    transition:.35s;
    color:#f7e8ee;
    text-align:center;
}

.choice:hover{
    transform:translateY(-5px);
    border-color:#d8b45a;
    background:rgba(255,255,255,.06);
}

.choice-symbol{
    font-size:30px;
    display:block;
    margin-bottom:12px;
}

/* =========================
   DIA 9 ESTRELLAS
========================= */

.stars-container{
    position:relative;
    width:100%;
    max-width:850px;
    height:550px;
    margin:20px auto;
    overflow:hidden;
    border-radius:25px;
    background:
        radial-gradient(circle at center,rgba(70,40,80,.25),transparent 60%),
        #050507;
    border:1px solid rgba(218,180,75,.25);
}

.star{
    position:absolute;
    border:0;
    background:none;
    color:#a89ca3;
    font-size:20px;
    transition:.5s;
    filter:drop-shadow(0 0 2px rgba(255,255,255,.2));
}

.star:hover{
    transform:scale(1.6);
    color:#fff;
}

.star.discovered{
    color:#e5c65e;
    filter:drop-shadow(0 0 14px #e5c65e);
}

.reason-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(10px);
}

.reason-overlay.active{
    display:flex;
}

.reason-card{
    width:min(650px,94vw);
    padding:50px;
    text-align:center;
    background:#120c12;
    border:1px solid rgba(218,180,75,.45);
    border-radius:25px;
    box-shadow:0 30px 100px #000;
}

.reason-number{
    color:#d9b85d;
    letter-spacing:4px;
    margin-bottom:20px;
}

/* =========================
   DIA 10 MÚSICA
========================= */

.music-player{
    max-width:650px;
    margin:35px auto;
    padding:40px;
    text-align:center;
    border:1px solid rgba(218,180,75,.3);
    border-radius:25px;
    background:rgba(255,255,255,.03);
}

.music-note{
    font-size:80px;
    animation:musicFloat 3s ease-in-out infinite;
    color:#d9b85d;
}

@keyframes musicFloat{
    50%{
        transform:translateY(-10px) rotate(3deg);
    }
}

audio{
    width:100%;
    margin-top:25px;
}

/* =========================
   DIA 11 RELOJ
========================= */

.clock{
    width:210px;
    height:210px;
    border-radius:50%;
    border:2px solid #cba84d;
    margin:30px auto;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    box-shadow:0 0 45px rgba(218,180,75,.08);
}

.clock-number{
    font-family:'Cormorant Garamond',serif;
    font-size:50px;
    color:#e0c26b;
}

.clock.stopped{
    box-shadow:0 0 70px rgba(218,180,75,.3);
}

/* =========================
   DIA 12 PISTA
========================= */

.footprints{
    display:flex;
    justify-content:center;
    gap:30px;
    margin:35px 0;
}

.foot{
    font-size:30px;
    color:#d9b85d;
    transform:rotate(-25deg);
    animation:footStep 2s infinite;
}

.foot:nth-child(2){animation-delay:.2s}
.foot:nth-child(3){animation-delay:.4s}
.foot:nth-child(4){animation-delay:.6s}
.foot:nth-child(5){animation-delay:.8s}

@keyframes footStep{
    50%{
        transform:rotate(-25deg) translateY(-8px);
        opacity:.55;
    }
}

/* =========================
   INPUT JUEGO
========================= */

.answer-input{
    width:min(650px,100%);
    padding:18px;
    border-radius:15px;
    background:#0c090c;
    color:white;
    border:1px solid rgba(218,180,75,.35);
    outline:none;
    text-align:center;
    font-size:18px;
}

/* =========================
   DIA 15 OCULTO
========================= */

.hidden-memory-page{
    position:relative;
    width:100%;
    max-width:850px;
    height:560px;
    margin:30px auto;
    overflow:hidden;
    border-radius:25px;
    background:
        radial-gradient(circle at 25% 35%,rgba(230,160,185,.09),transparent 20%),
        radial-gradient(circle at 75% 65%,rgba(218,180,75,.07),transparent 20%),
        #0b080b;
    border:1px solid rgba(218,180,75,.22);
}

.search-hint{
    text-align:center;
    margin-top:15px;
    color:#95868d;
    font-size:13px;
}

.secret-zone{
    position:absolute;
    width:90px;
    height:90px;
    border-radius:50%;
    cursor:pointer;
    opacity:.01;
}

.secret-zone:hover{
    opacity:.04;
    background:#d9b85d;
}

.zone-one{
    left:18%;
    top:25%;
}

.zone-two{
    right:17%;
    bottom:24%;
}

.found-memory{
    display:none;
    position:absolute;
    inset:0;
    background:rgba(5,4,5,.94);
    align-items:center;
    justify-content:center;
    padding:25px;
}

.found-memory.active{
    display:flex;
}

/* =========================
   DIA 16
========================= */

.final-day-summary{
    margin-top:40px;
    padding:30px;
    border:1px solid rgba(218,180,75,.25);
    border-radius:20px;
    background:rgba(255,255,255,.025);
}

/* =========================
   DIA 17
========================= */

.stay-button{
    font-size:18px;
    min-width:230px;
}

.countdown{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(45px,8vw,80px);
    letter-spacing:5px;
    color:#e3c768;
    margin:30px 0;
}

/* =========================
   DIA 18
========================= */

.big-countdown{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    max-width:850px;
    margin:40px auto;
}

.time-box{
    padding:25px 10px;
    border:1px solid rgba(218,180,75,.3);
    border-radius:18px;
    background:rgba(255,255,255,.025);
}

.time-number{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(35px,6vw,65px);
    color:#e4c86b;
}

.time-label{
    font-size:9px;
    letter-spacing:2px;
    color:#9f8e96;
}

/* =========================
   DIA 19
========================= */

.final-25{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(130px,25vw,270px);
    line-height:.8;
    color:#e3c768;
    text-shadow:0 0 50px rgba(218,180,75,.2);
}

.video-placeholder{
    max-width:750px;
    margin:35px auto;
    border:1px solid rgba(218,180,75,.3);
    border-radius:22px;
    padding:45px;
    background:rgba(255,255,255,.025);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){

    .card{
        padding:35px 22px;
    }

    .calendar-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .choice-grid{
        grid-template-columns:1fr;
    }

    .big-countdown{
        grid-template-columns:repeat(2,1fr);
    }

    .stars-container{
        height:470px;
    }
}

@media(max-width:500px){

    .screen{
        padding:25px 12px;
    }

    .calendar-grid{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .day-card{
        min-height:125px;
        padding:15px;
    }

    .day-title{
        font-size:22px;
    }

    .day-status{
        left:15px;
        bottom:10px;
    }

    .quote{
        font-size:23px;
    }
}
</style>
</head>

<body>

<div class="background-particles" id="particles"></div>

<div id="app"></div>

<div class="reason-overlay" id="reasonOverlay">
    <div class="reason-card">
        <div class="reason-number" id="reasonNumber"></div>
        <div class="quote" id="reasonText"></div>
        <p id="reasonRemaining" style="margin-top:25px;"></p>
        <button class="btn" onclick="closeReason()">CONTINUAR ✦</button>
    </div>
</div>


<script>

/* ============================================================
   CONFIGURACIÓN
============================================================ */

const PASSWORD = "0226";

const app = document.getElementById("app");

let currentDay = 0;
let daySlides = {};
let currentSlide = 0;

let discoveredStars = new Set();
let day3Opened = false;
let day3Choices = new Set();

let day15Found = new Set();

let selectedAnswersDay4 = [];
let selectedAnswersDay5 = [];

let countdownTimer = null;


/* ============================================================
   PARTÍCULAS
============================================================ */

function createParticles(){

    const container = document.getElementById("particles");

    for(let i=0;i<45;i++){

        const p = document.createElement("div");

        p.className = "particle";

        p.style.left = Math.random()*100 + "%";
        p.style.animationDuration = (8 + Math.random()*15) + "s";
        p.style.animationDelay = (-Math.random()*15) + "s";

        container.appendChild(p);
    }
}

createParticles();


/* ============================================================
   NAVEGACIÓN
============================================================ */

function showScreen(html){

    app.innerHTML = `
        <div class="screen">
            ${html}
        </div>
    `;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


function backCalendar(){

    currentDay = 0;
    currentSlide = 0;

    showCalendar();
}


/* ============================================================
   PORTADA
============================================================ */

function showCover(){

    showScreen(`

        <div class="card cover">

            <div class="tiny">
                Una pequeña sorpresa para ti
            </div>

            <h1>
                Felices 25
            </h1>

            <h2>
                Ana Lidia
            </h2>

            <div class="cover-line"></div>

            <p class="cover-sub">
                19 días · 19 páginas · una historia
            </p>

            <div style="margin-top:35px;">

                <button class="btn" onclick="showIntroduction()">
                    COMENZAR ✦
                </button>

            </div>

        </div>

    `);
}


/* ============================================================
   INTRODUCCIÓN
============================================================ */

function showIntroduction(){

    showScreen(`

        <div class="card">

            <div class="small-label">
                Ana Lidia · Antes de comenzar
            </div>

            <h2>
                Una pequeña historia
            </h2>

            <div class="romantic-text">

                <p>
                    Amor...
                </p>

                <p>
                    Esto no es solamente un regalo.
                    Quería hacer algo diferente para tus 25.
                    Algo que no pudieras abrir de una vez y terminar.
                </p>

                <p>
                    Quiero que lo descubrieras poco a poco.
                    Desde hoy hasta el 19 de septiembre,
                    cada día habrá una pequeña puerta.
                </p>

                <p>
                    No tienes que descubrirlo todo hoy.
                    La idea es que vuelvas mañana.
                    Y pasado.
                    Y al día siguiente.
                </p>

                <p>
                    Porque esta historia tiene una fecha final.
                </p>

                <p class="quote center">
                    Tu cumpleaños.
                </p>

                <p>
                    Pero antes de llegar a él,
                    hay 19 días para recorrer.
                </p>

            </div>

            <div class="nav-buttons">

                <button class="btn" onclick="showPassword()">
                    CONTINUAR ✦
                </button>

            </div>

        </div>

    `);
}


/* ============================================================
   CONTRASEÑA
============================================================ */

function showPassword(){

    showScreen(`

        <div class="card">

            <div class="small-label">
                Una contraseña
            </div>

            <h2>
                Cuatro números.
            </h2>

            <div class="romantic-text">

                <p>
                    Hay cuatro números escondidos,
                    de un recuerdo que guardamos las dos.
                </p>

                <p>
                    Los dos primeros marcan el día
                    en que nuestra historia comenzó.
                </p>

                <p>
                    Los dos últimos guardan el año
                    en que aquel momento nació.
                </p>

                <p>
                    No fue una fecha para el mundo,
                    ni quedó escrita en ningún calendario,
                    pero para nosotras dos
                    se volvió un recuerdo extraordinario.
                </p>

                <p>
                    Si recuerdas cuál fue aquel día,
                    los cuatro números hallarás.
                </p>

                <p>
                    Y si aún guardas aquel momento...
                    la puerta atravesarás.
                </p>

            </div>

            <div class="password-box">

                <input
                    id="passwordInput"
                    class="password-input"
                    maxlength="4"
                    inputmode="numeric"
                    placeholder="••••"
                    onkeydown="if(event.key==='Enter')checkPassword()"
                >

                <br>

                <button class="btn" onclick="checkPassword()">
                    DESBLOQUEAR
                </button>

                <div id="passwordError"></div>

            </div>

        </div>

    `);
}


function checkPassword(){

    const input = document.getElementById("passwordInput");
    const error = document.getElementById("passwordError");

    if(input.value === PASSWORD){

        showCalendar();

    }else{

        error.className = "error";

function createStars(){

    const container = document.getElementById("starsContainer");

    container.innerHTML = "";

    for(let i=0;i<25;i++){

        const star = document.createElement("button");

        star.className = "star";

        if(discoveredStars.has(i)){
            star.classList.add("discovered");
        }

        star.innerHTML = "✦";

        star.style.left = (5 + Math.random()*88) + "%";
        star.style.top = (5 + Math.random()*85) + "%";
        star.style.fontSize = (16 + Math.random()*20) + "px";

        star.onclick = ()=>openReason(i,star);

        container.appendChild(star);
    }

    updateStarCounter();
}


function openReason(index,star){

    if(discoveredStars.has(index)) return;

    discoveredStars.add(index);

    star.classList.add("discovered");

    document.getElementById("reasonNumber").textContent =
        `RAZÓN #${String(index+1).padStart(2,"0")}`;

    document.getElementById("reasonText").textContent =
        reasons[index];

    document.getElementById("reasonRemaining").textContent =
        `Una menos... quedan ${25-discoveredStars.size}.`;

    document.getElementById("reasonOverlay")
        .classList.add("active");

    updateStarCounter();
}


function closeReason(){

    document.getElementById("reasonOverlay")
        .classList.remove("active");

    if(discoveredStars.size === 25){

        document.getElementById("starFinal").innerHTML = `

            <div class="romantic-text" style="margin-top:30px;">

                <h2>
                    25 de 25
                </h2>

                    encontrando nuevas razones para amarte.
                </p>

                <p>

                </p>

                <p class="quote gold">
                    Porque lo que siento por ti
                    no cabe en una lista. ♡
                </p>

            </div>

        `;

    }
}


function updateStarCounter(){

    const counter = document.getElementById("starCounter");

    if(counter){
        counter.textContent = `${discoveredStars.size} / 25`;
    }
}

function startBirthdayCountdown(){

    if(countdownTimer){
        clearInterval(countdownTimer);
    }

    function update(){

        const now = new Date();

        let target = new Date(
            now.getFullYear(),
            8,
            19,
            0,
            0,
            0,
            0
        );

        if(now >= target){

            target = new Date(
                now.getFullYear()+1,
                8,
                19,
                0,
                0,
                0,
                0
            );

        }

        const diff = target - now;

        const days = Math.floor(diff/(1000*60*60*24));

        const hours = Math.floor(
            (diff%(1000*60*60*24))/(1000*60*60)
        );

        const minutes = Math.floor(
            (diff%(1000*60*60))/(1000*60)
        );

        const seconds = Math.floor(
            (diff%(1000*60))/1000
        );

        const d = document.getElementById("cdDays");

        if(!d) return;

        d.textContent = String(days).padStart(2,"0");

        document.getElementById("cdHours").textContent =
            String(hours).padStart(2,"0");

        document.getElementById("cdMinutes").textContent =
            String(minutes).padStart(2,"0");

        document.getElementById("cdSeconds").textContent =
            String(seconds).padStart(2,"0");

    }

    update();

    countdownTimer = setInterval(update,1000);
}
